name: gtk4-live-css

# Rebuilds Arch's gtk4 with gtk4-live-css/gtk4-user-css-live-reload.patch
# and publishes the result plus a pacman database to the `gtk4-live-css-repo`
# release, so the package tracks Arch instead of going stale in pkgs/.
#
# Skips the (10-30 minute) build when the current Arch gtk4 version is already
# published. Signs the package and the database when a GPG_PRIVATE_KEY secret
# is configured.

on:
  schedule:
    # Arch bumps gtk4 every few weeks. Until our build of that version exists,
    # a package that needs gtk4>=newer conflicts with ours, so keep the window
    # short: four attempts a day.
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if this version is already published
        type: boolean
        default: false

permissions:
  contents: write

env:
  GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
  PACKAGE: gtk4-live-css
  # Must match stages/55-packages-repo.sh in the Nemesis repo:
  #   Server = https://github.com/C0d3C0r34u5/Nemesis-packages/releases/download/repo
  RELEASE_TAG: repo

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: install tools
        run: pacman -Syu --noconfirm --needed git python sudo curl gnupg

      - name: build user
        run: |
          id -u builder >/dev/null 2>&1 || useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder

      - name: derive PKGBUILD from Arch
        id: derive
        run: |
          set -euo pipefail
          base=https://gitlab.archlinux.org/archlinux/packaging/packages/gtk4/-/raw/main
          curl -fsSL -o arch.PKGBUILD "$base/PKGBUILD"
          python3 gtk4-live-css/derive-pkgbuild.py arch.PKGBUILD > PKGBUILD
          cp gtk4-live-css/gtk4-user-css-live-reload.patch .

          # sanity: the derived PKGBUILD must be ours and must carry the patch
          grep -qx 'pkgname=gtk4-live-css' PKGBUILD
          grep -q 'gtk4-user-css-live-reload.patch' PKGBUILD
          grep -q 'conflicts=(gtk4)' PKGBUILD

          # Arch ships helper files next to its PKGBUILD (hooks, scripts) and
          # lists them in source=(); fetch every entry that is not a URL and not
          # our own patch. Let bash do the brace expansion ({hook,script}) and
          # $pkgver substitution, the same way makepkg will.
          epoch=$(sed -n 's/^epoch=//p' PKGBUILD)
          pkgver=$(sed -n 's/^pkgver=//p' PKGBUILD)
          pkgrel=$(sed -n 's/^pkgrel=//p' PKGBUILD)
          body=$(awk '/^source=\(/,/^\)/' PKGBUILD | sed -E '1d; $d; s/^[[:space:]]+//; s/[[:space:]]+$//')
          eval "sources=( $body )"
          for f in "${sources[@]}"; do
            case $f in
              git+*|http://*|https://*|gtk4-user-css-live-reload.patch) continue ;;
            esac
            echo "fetching $f"
            curl -fsSL -o "$f" "$base/$f"
          done
          ls -1 ./*.hook ./*.script 2>/dev/null || true

          echo "epoch=${epoch:-0} pkgver=$pkgver pkgrel=$pkgrel"
          echo "asset=$PACKAGE-${epoch:+$epoch.}$pkgver-$pkgrel" >> "$GITHUB_OUTPUT"

      - name: already published?
        id: published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          asset='${{ steps.derive.outputs.asset }}'
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "forced rebuild"
            echo "skip=no" >> "$GITHUB_OUTPUT"
          elif curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
             | grep -q "\"name\": \"$asset"; then
            echo "skip=yes" >> "$GITHUB_OUTPUT"
          else
            echo "skip=no" >> "$GITHUB_OUTPUT"
          fi

      - name: import signing key
        id: key
        if: steps.published.outputs.skip == 'no' && env.GPG_PRIVATE_KEY != ''
        run: |
          set -euo pipefail
          # makepkg signs as `builder`, repo-add signs as root: both keyrings
          # need the key.
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          printf '%s' "$GPG_PRIVATE_KEY" | sudo -H -u builder gpg --batch --import
          fpr=$(gpg --list-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')
          [ -n "$fpr" ] || { echo "no key imported"; exit 1; }
          echo "fingerprint $fpr"
          echo "fpr=$fpr" >> "$GITHUB_OUTPUT"

      - name: build
        id: build
        if: steps.published.outputs.skip == 'no'
        run: |
          set -euo pipefail
          id -u builder >/dev/null 2>&1 || useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder
          chown -R builder: .
          sign=""
          gpgkey=""
          [ -n "${GPG_PRIVATE_KEY:-}" ] && { sign="--sign"; gpgkey="${{ steps.key.outputs.fpr }}"; }
          sudo -H -u builder env GPGKEY="$gpgkey" \
            PACKAGER="Nemesis Packages <packages@nemesis.invalid>" \
            makepkg -s --noconfirm $sign
          # we do not ship debug symbols in the repo
          rm -f ./*-debug-*.pkg.tar.zst ./*-debug-*.pkg.tar.zst.sig
          ls -l ./*.pkg.tar.zst*
          # prepare() drops this marker when the patch no longer applies (see
          # derive-pkgbuild.py): we still publish, so nobody is left on an old
          # gtk4, but the release says so.
          if [ -f .unpatched ]; then
            echo "unpatched=yes" >> "$GITHUB_OUTPUT"
            echo "::warning title=gtk4-live-css unpatched::the live-css patch did not apply; this build is stock gtk4"
          else
            echo "unpatched=no" >> "$GITHUB_OUTPUT"
          fi

      - name: pacman database
        if: steps.published.outputs.skip == 'no'
        run: |
          set -euo pipefail
          mkdir -p repo
          # pacman downloads <pkg>.sig next to each package, so the signatures
          # must be published too (SigLevel = Required on the client).
          cp ./*.pkg.tar.zst repo/
          shopt -s nullglob
          sigs=(./*.pkg.tar.zst.sig)
          if (( ${#sigs[@]} )); then cp "${sigs[@]}" repo/; fi
          sign=()
          if [ -n "${GPG_PRIVATE_KEY:-}" ]; then
            sign=(--sign --key "${{ steps.key.outputs.fpr }}")
          fi
          ( cd repo && repo-add "${sign[@]}" "$PACKAGE.db.tar.gz" ./*.pkg.tar.zst )
          ls -l repo

      - name: publish
        if: steps.published.outputs.skip == 'no'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: gtk4-live-css pacman repository
          body: |
            Pacman repository for `gtk4-live-css` (Arch's gtk4 + the live
            user-CSS reload patch). Machine-built by
            `.github/workflows/gtk4-live-css.yml`; see
            `gtk4-live-css/README.md`. Clients use the release tag `repo`.
            ${{ steps.build.outputs.unpatched == 'yes' && '⚠️ This build is STOCK gtk4: the live-css patch did not apply to this GTK version. It is published so packages needing the newer gtk4 do not conflict; re-dispatch with force once the patch is fixed.' || '' }}
          files: repo/*
          fail_on_unmatched_files: true
